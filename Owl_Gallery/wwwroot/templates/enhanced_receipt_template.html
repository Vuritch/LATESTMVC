
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receipt</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9ff url('https://i.imgur.com/xgU8e8F.png') no-repeat top right;
      padding: 40px;
      color: #333;
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
    }
    .header img {
      width: 120px;
    }
    .header h1 {
      margin: 10px 0 5px;
      color: #5d16c1;
    }
    .info {
      margin: 20px 0;
    }
    .info p {
      margin: 5px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #eee;
    }
    .total {
      text-align: right;
      font-size: 1.2em;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://i.imgur.com/xgU8e8F.png" alt="Logo" />
    <h1>Order Receipt</h1>
    <p>Thank you for shopping with Owl Gallery!</p>
  </div>

  <div class="info">
    <p><strong>Order ID:</strong> #{{OrderId}}</p>
    <p><strong>Name:</strong> {{CustomerName}}</p>
    <p><strong>Email:</strong> {{Email}}</p>
    <p><strong>Date:</strong> {{OrderDate}}</p>
  </div>

  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      {{OrderRows}}
    </tbody>
  </table>

  <div class="total">
    Total Paid: EGP {{Total}}
  </div>
</body>
</html>
